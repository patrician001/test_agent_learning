[project]
name = "repostats"
version = "0.1.0"
description = "Small statistics about the files in a repository checkout."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["repostats"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["repostats", "tests"]

[tool.ruff]
line-length = 100
